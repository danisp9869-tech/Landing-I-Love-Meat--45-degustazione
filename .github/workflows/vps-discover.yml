name: VPS discover (diagnostica sola lettura)

# Si collega alla VPS in sola lettura per capire quale cartella Nginx serve.
# Non modifica nulla sul server. Avvio manuale da Actions.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Prepara la chiave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Trova la cartella servita da Nginx
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          TGT="$VPS_TARGET_DIR"
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            echo '===== VPS_TARGET_DIR (dove scrive Actions) =====';
            echo '$TGT'; echo 'resolved:'; readlink -f '$TGT' 2>/dev/null;
            echo; echo '===== /var/www ====='; ls -la /var/www 2>/dev/null;
            echo; echo '===== root/alias in nginx =====';
            (nginx -T 2>/dev/null || cat /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf 2>/dev/null) | grep -nE 'server_name|root |alias ' | sed 's/^ *//' | sort -u;
            echo; echo '===== index.html ARANCIONE #e0562c (=cartella servita ora) =====';
            grep -rl 'e0562c' /var/www /home /srv 2>/dev/null;
            echo; echo '===== index.html ROSSO #d1281f (=deploy Actions) =====';
            grep -rl 'd1281f' /var/www /home /srv 2>/dev/null;
            echo; echo '===== symlink current / releases =====';
            ls -la /var/www/*/current 2>/dev/null; ls -la /var/www/*/releases 2>/dev/null | head -8;
          "
