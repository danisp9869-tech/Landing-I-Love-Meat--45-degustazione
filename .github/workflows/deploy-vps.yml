name: Deploy landing su VPS (Nginx via SSH)

# Pubblica il sito su un server proprio (VPS con Nginx) via SSH+rsync.
# In alternativa a GitHub Pages: vedi README §5.
#
# ⚠️  AVVIO AUTOMATICO DISATTIVATO — il deploy in produzione ora passa da
#     `push deploy` (script .deploy/push-deploy.sh sul Mac), che pubblica con
#     un sistema a release atomiche in /var/www/<sito>/releases + symlink
#     `current`. Questo workflow scrive invece direttamente in VPS_TARGET_DIR:
#     lasciarlo partire ad ogni push su main significherebbe due deploy
#     concorrenti su percorsi diversi.
#     Resta avviabile a mano da Actions → Run workflow come ripiego di
#     emergenza. Per riattivarlo in automatico, rimetti il blocco `push:`
#     qui sotto e allinea VPS_TARGET_DIR.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:   # solo avvio manuale dalla tab "Actions"

# Evita deploy sovrapposti sullo stesso server
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Prepara la chiave SSH e il known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Se non è impostata la porta, usa la 22 di default
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sincronizza i file sul server (rsync)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          # --delete: rimuove sul server i file non più presenti nel repo
          # gli --exclude tengono fuori tutto ciò che non fa parte del sito
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='README.md' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_TARGET_DIR/"
