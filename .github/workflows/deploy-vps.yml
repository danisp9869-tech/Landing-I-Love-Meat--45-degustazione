name: Deploy landing su VPS (release atomiche)

# Pubblica la landing CENA sul dominio prenotadegustazione.ilovemeatgriglieria.it
# servito da Nginx da /var/www/ilm-45/current (symlink a una release).
# Deploy atomico: crea /var/www/ilm-45/releases/<timestamp>, ci copia i file,
# poi sposta il symlink `current`.
#
# ⚠️ RICHIEDE che l'utente SSH ($VPS_USER) abbia permesso di scrittura su
#    /var/www/ilm-45 (oggi è di root → "mkdir: Permission denied").
#    Finché non è concesso, la produzione si aggiorna con `push deploy` dal Mac.
#    Per abilitare l'automatico, sul server (da root):
#       chown -R $VPS_USER:$VPS_USER /var/www/ilm-45
#    poi rimetti il blocco `push:` qui sotto.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:   # solo avvio manuale finché i permessi non sono concessi

concurrency:
  group: deploy-vps-ilm45
  cancel-in-progress: true

env:
  SITE_BASE: /var/www/ilm-45

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Prepara la chiave SSH e known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy atomico (nuova release + symlink current)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          TS=$(date +%Y%m%d-%H%M%S)
          REL="$SITE_BASE/releases/$TS"
          SSH="ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22} -o StrictHostKeyChecking=no"

          echo "Creo la release $REL"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p '$REL'"

          echo "Copio i file del sito nella release"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='README.md' \
            --exclude='apps-script.gs' \
            --exclude='google-sheet-setup.md' \
            ./ "$VPS_USER@$VPS_HOST:$REL/"

          echo "Sposto il symlink current sulla nuova release (atomico)"
          $SSH "$VPS_USER@$VPS_HOST" "ln -sfn '$REL' '$SITE_BASE/current'"

          echo "Fatto. current -> $REL"
          $SSH "$VPS_USER@$VPS_HOST" "ls -la '$SITE_BASE/current'"
